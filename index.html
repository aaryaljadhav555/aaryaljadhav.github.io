<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aaryal Jadhav | Data Scientist</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">AJ<span>.</span></div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#certificates">Certificates</a></li>
        </ul>
    </nav>

    <section id="certificates" class="container">
        <h2 class="section-title">Professional Certifications</h2>
        <p class="section-subtitle">Click any certificate to view full size</p>
        
        <div class="cert-grid">
            <div class="cert-card" onclick="openLightbox('images/deloite.png')">
                <div class="cert-img-box"><img src="images/deloite.png" alt="Deloitte"></div>
                <div class="cert-info"><h3>Data Analytics</h3><p>Deloitte</p></div>
            </div>

            <div class="cert-card" onclick="openLightbox('images/modern ai.png')">
                <div class="cert-img-box"><img src="images/modern ai.png" alt="Cisco AI"></div>
                <div class="cert-info"><h3>Modern AI</h3><p>Cisco Academy</p></div>
            </div>

            <div class="cert-card" onclick="openLightbox('images/yuva ai.png')">
                <div class="cert-img-box"><img src="images/yuva ai.png" alt="Nasscom"></div>
                <div class="cert-info"><h3>Yuva AI for All</h3><p>Nasscom</p></div>
            </div>

            <div class="cert-card" onclick="openLightbox('images/matlab.png')">
                <div class="cert-img-box"><img src="images/matlab.png" alt="Vanderbilt"></div>
                <div class="cert-info"><h3>MATLAB Programming</h3><p>Vanderbilt</p></div>
            </div>

            <div class="cert-card" onclick="openLightbox('images/power bi.png')">
                <div class="cert-img-box"><img src="images/power bi.png" alt="Power BI"></div>
                <div class="cert-info"><h3>AI-Powered PowerBI</h3><p>Office Master</p></div>
            </div>

            <div class="cert-card" onclick="openLightbox('images/mobile device.png')">
                <div class="cert-img-box"><img src="images/mobile device.png" alt="Cisco Mobile"></div>
                <div class="cert-info"><h3>IT Essentials</h3><p>Cisco Academy</p></div>
            </div>
        </div>
    </section>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
</html>
